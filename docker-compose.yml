version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  sensor:
    build: ./ebpf
    privileged: true
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERS: kafka:9092
      FILTER_PORTS: "80,443,8080,8443"
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /usr/src/linux-headers-$(uname -r):/usr/src/linux-headers:ro
    network_mode: host

  backend:
    build: ./backend
    depends_on:
      - postgres
      - redis
      - kafka
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres/sentinel
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  pgdata: