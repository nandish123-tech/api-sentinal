[package]
name = "sensor"
version = "0.1.0"
edition = "2021"

[dependencies]
aya = "0.12"
aya-log = "0.12"
tokio = { version = "1", features = ["full"] }
rdkafka = { version = "0.35", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
anyhow = "1"

[[bin]]
name = "sensor"
path = "src/main.rs"